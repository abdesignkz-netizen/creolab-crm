name: Release acceptance

on:
  push:
    branches: [main, codex/stage8-release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: PostgreSQL migration and full business flow
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: basqar
          POSTGRES_PASSWORD: basqar_ci_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U basqar -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: PostgreSQL backup tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
      - name: Install server workspace graph
        run: npm ci --include=dev --include-workspace-root=false --workspace=@creolab/api --workspace=@creolab/web --workspace=@creolab/worker --workspace=@creolab/db --workspace=@creolab/contracts --workspace=@creolab/integrations
      - name: Real PostgreSQL checks
        env:
          BASQAR_TEST_POSTGRES_URL: postgresql://basqar:basqar_ci_only@127.0.0.1:5432/postgres
        run: |
          set -o pipefail
          node scripts/test-api.mjs --postgres workspaceAcceptance outboxLease schemaPatches financialReporting analyticsPeriods situationSweepMigration postgresRuntime.postgres 2>&1 | tee /tmp/basqar-postgres-checks.log
      - name: Report failing test details
        if: failure()
        run: node scripts/ci-error-annotation.mjs /tmp/basqar-postgres-checks.log

  container:
    name: Full Docker image and API/worker startup
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: basqar
          POSTGRES_PASSWORD: basqar_ci_only
          POSTGRES_DB: basqar_runtime_acceptance
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U basqar -d basqar_runtime_acceptance"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the complete deployment image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: api
          load: true
          push: false
          tags: basqar:acceptance
          cache-from: type=gha,scope=basqar-runtime
          cache-to: type=gha,mode=max,scope=basqar-runtime
      - name: Initialize disposable container database
        env:
          PGPASSWORD: basqar_ci_only
        run: psql -h 127.0.0.1 -U basqar -d basqar_runtime_acceptance -v ON_ERROR_STOP=1 -f packages/db/prisma/init.sql
      - name: Start production API and worker from the image
        env:
          BASQAR_CONTAINER_POSTGRES_URL: postgresql://basqar:basqar_ci_only@127.0.0.1:5432/basqar_runtime_acceptance
        run: |
          set -o pipefail
          node scripts/check-container-runtime.mjs 2>&1 | tee /tmp/basqar-container-checks.log
      - name: Report startup failures
        if: failure()
        run: node scripts/ci-error-annotation.mjs /tmp/basqar-container-checks.log
