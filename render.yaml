# Render Blueprint (optional). Prefer setting these in the Dashboard if Blueprint is not used.
# Persistent Disk requires a paid plan (Starter+). Free instances wipe local files on every deploy/restart.

services:
  - type: web
    name: creolab-crm
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    disk:
      name: creolab-crm-files
      mountPath: /var/data
      sizeGB: 5
    envVars:
      # Domain migration is staged in Dashboard after DNS/TLS verification.
      # Apply only the variables from deploy/bsqr-domain.env.example; keep existing secrets.
      # Do not enable the legacy redirect before bsqr.kz is reachable.
      - key: NODE_ENV
        value: production
      - key: STORAGE_DIR
        value: /var/data/files
      - key: STORAGE_PERSISTENT
        value: "1"
      # Official SDK jars must be uploaded once to the existing persistent disk.
      # The entrypoint starts a loopback-only verifier when this directory contains jars.
      # Do not upload user keys (.p12/.pfx) or put PINs in environment variables.
      - key: KALKAN_LIB_DIR
        value: /var/data/kalkan/lib
      - key: KALKAN_OCSP
        value: "1"
      # CreoLab uses the working IS ESF portal. These settings enable the
      # connection; each document still requires the user's NCALayer signature.
      # For services managed in the Dashboard, apply the same values there.
      - key: ESF_PROVIDER
        value: live
      - key: ESF_ENV
        value: prod
      - key: ESF_ALLOW_PROD
        value: "1"
      - key: ESF_ALLOW_LIVE_SEND
        value: "1"
      - key: ESF_BASE_URL
        value: https://esf.gov.kz:8443/esf-web
